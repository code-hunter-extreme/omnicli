name: PR-Agent (Qodo)

# Free, self-hosted AI PR reviewer (Qodo pr-agent). Acts as an independent
# second reviewer alongside Greptile. Private code is sent to whichever LLM
# provider's key you configure below — treat that as data egress to that
# provider, same tradeoff as any hosted reviewer.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr_agent:
    # Skip events raised by bots (e.g. Greptile) to avoid review loops.
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - name: Qodo PR-Agent
        uses: qodo-ai/pr-agent@main
        env:
          # REQUIRED: add one provider key as a repo Actions secret.
          # Default expects OPENAI_KEY. To use Anthropic/Gemini instead, set
          # the matching key here plus config.model per Qodo docs. Until a
          # secret exists this job runs but produces no review.
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
